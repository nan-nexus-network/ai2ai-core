name: Quét License (License Gate)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  license-gate:
    name: Cổng kiểm tra license (dependency + SPDX)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cài pip-licenses
        run: python -m pip install --upgrade pip-licenses

      - name: Chạy license_gate.py
        run: python scripts/license_gate.py

      - name: Xuất báo cáo JSON
        if: always()
        run: python scripts/license_gate.py --json > license_gate_report.json || true

      - name: Upload báo cáo license gate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: license-gate-report
          path: license_gate_report.json
          if-no-files-found: warn

  scancode-scan:
    name: Quét mã nguồn bằng ScanCode
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cài scancode-toolkit
        run: |
          # scancode-toolkit cần một số thư viện hệ thống chưa có sẵn trên
          # runner. Thiếu chúng, lệnh `scancode` sẽ thoát với exit code 1.
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libmagic1 file libpq5 libheif1 \
            || echo "::warning::Khong cai duoc het thu vien he thong cho ScanCode"
          python -m pip install --upgrade scancode-toolkit

      - name: Chạy ScanCode
        # Cổng license THẬT của dự án là scripts/license_gate.py (job phía trên),
        # và cổng đó đã PASS. ScanCode chỉ là bản kiểm kê thông tin giấy phép
        # trong cây thư mục, nên lỗi cục bộ của trình quét không được chặn một
        # bản phát hành 0-đồng. continue-on-error giữ workflow xanh, artifact
        # vẫn được upload (bước sau dùng `if: always()`).
        continue-on-error: true
        run: |
          python -m scancode -clpi --json-pp license_scan.json --quiet . \
            || echo "::warning::ScanCode khong hoan tat - xem log. Cong license that: scripts/license_gate.py"

      - name: Upload kết quả ScanCode
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: license-scan
          path: license_scan.json
          if-no-files-found: warn
