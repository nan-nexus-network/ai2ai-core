name: NAN AI2AI-SI2SI CI & Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Quét bảo mật (TruffleHog Secret Scan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Chạy TruffleHog kiểm tra rò rỉ API Key / Token
        uses: trufflesecurity/trufflehog@e63326d6545de8f425d93ce24078c6e68d83f70e # v3.99.3
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  test-poc-and-bridge:
    name: Kiểm thử PoC trên ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Da bao phu 3 he dieu hanh: Linux (ubuntu), macOS, Windows
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.8", "3.10", "3.12"]
        exclude:
          # macOS arm64 (macos-latest): Python 3.8 khong co ban dung chinh thuc
          # (Python chi phat hanh ban arm64 tu 3.9.1 tro di) -> macOS duoc test o 3.10 va 3.12.
          - os: macos-latest
            python-version: "3.8"
          # Ubuntu 24.04 (ubuntu-latest): bo tool cache mac dinh khong co san Python 3.8
          # -> Python 3.8 tren Linux duoc chay tren Ubuntu 22.04 (ben duoi).
          - os: ubuntu-latest
            python-version: "3.8"
        include:
          # Bo sung Python 3.8 tren Linux de phu day du ca 3 he dieu hanh
          - os: ubuntu-22.04
            python-version: "3.8"

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập môi trường Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Chạy thử nghiệm Demo 60 giây (Zero Dependencies)
        run: python examples/01-hello-agent/hello_bridge.py

      - name: Chạy bộ kiểm thử tự động (Unit Tests)
        run: python -m unittest discover -s tests -v
